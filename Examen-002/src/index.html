<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <main class="page">
            <header class="hero">
                <div>
                    <p class="eyebrow">PoliCalculadora</p>
                    <h1 class="title">Operaciones claras, estilo limpio</h1>
                    <p class="subtitle">
                        Suma y resta en decimal, ahora también suma en binario.
                    </p>
                </div>
            </header>

            <section class="grid">
                <article class="card">
                    <div class="card-header">
                        <p class="pill">Modo decimal</p>
                        <h2 class="card-title">Suma y resta</h2>
                        <p class="card-subtitle">
                            Ingresa dos números y calcula al instante.
                        </p>
                    </div>
                    <div class="form-row">
                        <label for="num1">Número 1</label>
                        <input
                            type="number"
                            id="num1"
                            placeholder="Ej: 12"
                            aria-label="Número 1"
                        />
                    </div>
                    <div class="form-row">
                        <label for="num2">Número 2</label>
                        <input
                            type="number"
                            id="num2"
                            placeholder="Ej: 8"
                            aria-label="Número 2"
                        />
                    </div>
                    <div class="actions">
                        <button class="btn primary" onclick="calcularSuma()">
                            Sumar
                        </button>
                        <button class="btn ghost" onclick="calcularResta()">
                            Restar
                        </button>
                    </div>
                    <p class="result">
                        Resultado: <span id="resultado">0</span>
                    </p>
                </article>

                <article class="card accent">
                    <div class="card-header">
                        <p class="pill pill-light">Modo binario</p>
                        <h2 class="card-title">Suma binaria</h2>
                        <p class="card-subtitle">
                            Trabaja con números en base 2.
                        </p>
                    </div>
                    <div class="form-row">
                        <label for="bin1">Binario 1</label>
                        <input
                            type="text"
                            id="bin1"
                            placeholder="Ej: 1011"
                            aria-label="Binario 1"
                        />
                    </div>
                    <div class="form-row">
                        <label for="bin2">Binario 2</label>
                        <input
                            type="text"
                            id="bin2"
                            placeholder="Ej: 110"
                            aria-label="Binario 2"
                        />
                    </div>
                    <div class="actions">
                        <button
                            class="btn secondary"
                            onclick="calcularSumaBinaria()"
                        >
                            Sumar binarios
                        </button>
                    </div>
                    <p class="result">
                        Resultado binario: <span id="resultadoBinario">0</span>
                    </p>
                </article>
            </section>
        </main>

        <!-- Incluir los archivos JavaScript -->
        <script src="Operaciones/fehv-suma/suma.js"></script>
        <script src="Operaciones/fehv-resta/resta.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
