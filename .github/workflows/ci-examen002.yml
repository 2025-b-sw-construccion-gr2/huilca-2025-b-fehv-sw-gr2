name: CI Examen 002

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'Examen-002/**' # Solo se activa si tocas archivos de ESTA carpeta
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Examen-002/**'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen-002

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './Examen-002/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  format:
    name: Check Code Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen-002

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './Examen-002/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen-002

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './Examen-002/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Examen-002/coverage/

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    defaults:
      run:
        working-directory: ./Examen-002

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './Examen-002/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: Examen-002/dist/